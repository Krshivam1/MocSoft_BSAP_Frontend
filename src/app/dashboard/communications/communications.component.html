<div class="container-fluid mt-4">
  <div class="row mb-2">
    <div class="col-12">
      <button class="btn btn-primary" (click)="startNew()">Create New Communication</button>
    </div>
  </div>
</div>

<!-- Table -->
<div class="container-fluid">
  <div class="row">
    <div class="col-12">
      <div class="table-panel">
        <table class="table table-bordered table-sm">
          <thead>
            <tr>
              <th>Sr. No.</th>
              <th>Created Date</th>
              <th>Subject</th>
              <th>Message/Question</th>
              <th>Document</th>
              <th>View/Details</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let c of communications; let i = index">
              <td>{{ i + 1 }}</td>
              <td>{{ c.createdDate }}</td>
              <td>{{ c.subject }}</td>
              <td>{{ c.message }}</td>
              <td>
                <a *ngIf="c.document" href="{{ c.document }}" target="_blank">View</a>
              </td>
              <td>
                <button class="btn btn-info btn-sm" (click)="detail()">Details</button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- Modal -->
<div class="modal" id="newCommunicationModal" [style.display]="showModal ? 'block' : 'none'">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">

      <!-- Header -->
      <div class="modal-header">
        <h5 class="modal-title">Start New Communication</h5>
        <button type="button" class="btn-close" (click)="closeModal()" aria-label="Close"></button>
      </div>

      <!-- Body -->
      <div class="modal-body">
        <form (ngSubmit)="onSubmit()" #communicationForm="ngForm">

          <!-- District -->
          <div class="form-group row mb-3">
            <label class="col-sm-3 col-form-label fw-semibold">District :</label>
            <div class="col-sm-9">
              <div class="dropdown">
                <button class="form-select text-start dropdown-toggle" 
                        type="button" 
                        id="districtDropdown" 
                        data-bs-toggle="dropdown" 
                        aria-expanded="false"
                        [class.btn-outline-primary]="selectedDistricts.length > 0">
                  {{ selectedDistricts.length > 0 ? (selectedDistricts.length + ' districts selected') : 'Select Districts' }}
                </button>
                <div class="dropdown-menu p-3 w-100" aria-labelledby="districtDropdown">
                  <div *ngFor="let d of districts" class="form-check">
                    <input class="form-check-input" 
                           type="checkbox" 
                           [id]="'district-'+d.id"
                           [checked]="selectedDistricts.includes(d.id)"
                           (change)="onDistrictCheckboxChange(d.id, $event)">
                    <label class="form-check-label w-100" [for]="'district-'+d.id">
                      {{ d.districtName }}
                    </label>
                  </div>
                  <div class="dropdown-divider my-2"></div>
                  <div class="d-flex justify-content-between">
                    <button type="button" class="btn btn-sm btn-outline-secondary" (click)="selectAllDistricts()">Select All</button>
                    <button type="button" class="btn btn-sm btn-outline-secondary" (click)="clearAllDistricts()">Clear All</button>
                  </div>
                </div>
              </div>
              
              <div *ngIf="selectedDistricts.length > 0" class="mt-2">
                <strong>Selected Districts:</strong> 
                <span *ngFor="let name of getSelectedDistrictNames()" class="badge bg-primary me-1 mb-1">
                  {{ name }}
                </span>
              </div>
            </div>
          </div>

          <!-- Subject -->
          <div class="form-group row mb-3">
            <label class="col-sm-3 col-form-label fw-semibold">Subject :</label>
            <div class="col-sm-9">
              <input [(ngModel)]="communicationName" name="communicationName"
                     type="text" class="form-control" placeholder="Enter subject" required>
            </div>
          </div>

          <!-- Message -->
          <div class="form-group row mb-3">
            <label class="col-sm-3 col-form-label fw-semibold">Message :</label>
            <div class="col-sm-9">
              <textarea [(ngModel)]="message" name="message"
                        class="form-control" rows="4" maxlength="1000"
                        placeholder="Write your message..." required></textarea>
              <small class="form-text text-muted">
                {{ message.length }}/1000 characters
              </small>
            </div>
          </div>

          <!-- Attachments -->
          <div class="form-group row mb-3">
            <label class="col-sm-3 col-form-label fw-semibold">Attachments :</label>
            <div class="col-sm-9">
              <input type="file" (change)="onFileChange($event)" multiple
                     class="form-control"
                     accept="image/jpg,image/jpeg,image/png,application/pdf">

              <div id="fileList" class="mt-2">
                <span *ngFor="let file of attachments; let i = index"
                      class="badge bg-info text-white me-1 mb-1 d-inline-flex align-items-center">
                  {{ file.name }}
                  <button type="button" class="btn-close btn-close-white ms-1" 
                          (click)="removeFile(i)" style="font-size: 0.7rem;"></button>
                </span>
              </div>
            </div>
          </div>

          <!-- Footer -->
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" (click)="closeModal()">Close</button>
            <button type="submit" class="btn btn-primary">Send</button>
          </div>
        </form>
      </div>

    </div>
  </div>
</div>
